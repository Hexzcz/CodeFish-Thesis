name: tests

# Every push and every pull request. The suite is fast (about two seconds);
# the install is the slow part, so pip is cached.
on:
  push:
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the local venv. 3.9 and earlier cannot install current
          # geopandas or rasterio.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # USE_LOCAL_DATA keeps the suite off the network: no database, no
        # waiting out connection timeouts on a runner that cannot reach one.
        env:
          USE_LOCAL_DATA: '1'
        run: pytest -q

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix tests/e2e

      - name: Run browser tests
        # run.js starts the app itself and stops it afterwards.
        env:
          CODEFISH_PYTHON: python
        run: npm test --prefix tests/e2e

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t codefish:ci .

      - name: Boot it and check it answers
        # The wheels link against system libraries that python:*-slim does not
        # ship. That failure only appears in the container, so the container is
        # what gets tested.
        run: |
          docker run -d --name codefish-ci -p 8000:8000 codefish:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -X POST http://127.0.0.1:8000/route \
            -H 'Content-Type: application/json' \
            -d '{"origin_lat":14.6357,"origin_lon":121.0219,"scenario":"25yr"}' \
            -o /dev/null
          echo "image builds, boots, and routes"

      - name: Show the logs if it did not
        if: failure()
        run: docker logs codefish-ci || true
